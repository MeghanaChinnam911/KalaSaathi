version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./ml:/app/ml
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=
      - STORAGE_PATH=/app/storage
      - AI_ENV=development
